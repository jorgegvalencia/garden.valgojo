server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Detrás del proxy de Coolify: redirige /notas/x a /notas/x/ sin incluir el puerto interno
  absolute_redirect off;

  location / {
    try_files $uri $uri/ =404;
  }

  # Los assets de Astro llevan hash en el nombre
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
